<!DOCTYPE html>
<html>
<head>
    <title>🔍Insurance Fraud Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    body {
        font-family: Arial;
        background: #8c6fbb;
        margin: 0;
    }

    .navbar {
        background: #b55998;
        color: white;
        padding: 10px;
        text-align: center;
        font-size: 40px;
    }

    .container {
        width: 550px;
        margin: 10px auto;
        background: rgb(24, 166, 201);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
        height:460px ;
    }

    input {
        width: 95%;
        padding: 8px;
        margin: 8px 0;
    }

    button {
        padding: 10px 20px;
        background: #b55998;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #7f8a96;
    }

    .result {
        margin-top: 20px;
        font-size: 18px;
    }

    .dashboard {
        width: 600px;
        margin: 40px auto;
        background: rgb(179, 190, 195);
        padding: 20px;
        border-radius: 10px;
    }

    /* Risk Colors */
    .red {
        color: red;
        font-weight: bold;
    }

    .orange {
        color: orange;
        font-weight: bold;
    }

    .green {
        color: green;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="navbar">
    🚗 Auto Insurance Fraud Detection System
</div>

<div class="container">
    <h2>Enter Claim Details</h2>

<form action="/predict_auto" method="post"> 

<input type="number" name="age" placeholder="Age" 
value="{{ request.form.age }}" required>

<input type="number" name="months_as_customer" 
placeholder="Months as Customer" 
value="{{ request.form.months_as_customer }}" required>

<input type="number" name="policy_annual_premium" 
placeholder="Annual Premium" 
value="{{ request.form.policy_annual_premium }}" required>

<input type="number" name="total_claim_amount" 
placeholder="Total Claim Amount" 
value="{{ request.form.total_claim_amount }}" required>

<input type="number" name="incident_hour_of_the_day" 
placeholder="Incident Hour (0-23)" 
value="{{ request.form.incident_hour_of_the_day }}" required>

<input type="number" name="number_of_vehicles_involved" 
placeholder="Vehicles Involved" 
value="{{ request.form.number_of_vehicles_involved }}" required>

<button type="submit">Predict</button>
</form>

 <!-- ✅ Display prediction result here -->
    
{% if result %}
<p class="result {{ color }}">{{ result }}</p>
<p><b>Fraud Probability:</b> {{ probability }}%</p>

<br>

<a href="/">
<button>🔐 Go To Login Page</button>
</a>

{% endif %}


</div>


</body>
</html>
